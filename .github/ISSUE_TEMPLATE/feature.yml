name: Feature
description: A new capability or change to the app
labels: ['type:feat']
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this need to exist? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checklist. The PR is not done until every box is ticked.
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Files likely touched
      placeholder: src/routes/+page.svelte, src/lib/db/schema.ts
  - type: input
    id: blocked
    attributes:
      label: Blocked by
      placeholder: '#3'
